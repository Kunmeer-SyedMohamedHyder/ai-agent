name: Sync to Hugging Face Space

# On every push to main (and on manual dispatch), mirror this repo to the
# Hugging Face Space so the live app always runs the latest code.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force \
            "https://syedhyder1362k:${HF_TOKEN}@huggingface.co/spaces/syedhyder1362k/ai-agent" \
            main
